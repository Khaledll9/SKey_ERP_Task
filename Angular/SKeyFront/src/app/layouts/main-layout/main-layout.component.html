<div class="main-layout" dir="rtl">

  <header class="main-header">
    <div class="main-header__inner">

      <div class="main-header__start">
        <a routerLink="/dashboard" class="main-logo">
          <img src="/assets/images/logo.jpeg" class="main-logo__img" alt="Skey ERP" />
        </a>

        <nav class="main-nav">
          <a routerLink="/dashboard"
            routerLinkActive="main-nav__link--active"
            [routerLinkActiveOptions]="{exact: true}"
            class="main-nav__link">
            Dashboard
          </a>
          <a routerLink="/users"
            routerLinkActive="main-nav__link--active"
            [routerLinkActiveOptions]="{exact: true}"
            class="main-nav__link">
            Users
          </a>
          <a routerLink="/inventory"
            routerLinkActive="main-nav__link--active"
            [routerLinkActiveOptions]="{exact: true}"
            class="main-nav__link">
            Inventory
          </a>
          <a routerLink="/reports"
            routerLinkActive="main-nav__link--active"
            [routerLinkActiveOptions]="{exact: true}"
            class="main-nav__link">
            Reports
          </a>
          <a routerLink="/settings"
            routerLinkActive="main-nav__link--active"
            [routerLinkActiveOptions]="{exact: true}"
            class="main-nav__link">
            Settings
          </a>
        </nav>
      </div>

      <div class="main-header__end">
        <skey-input
          placeholder="بحث..."
          iconRight="<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='2' stroke='currentColor' class='main-header__search-icon'><path stroke-linecap='round' stroke-linejoin='round' d='m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z' /></svg>"
          class="main-header__search">
        </skey-input>

        <button class="main-header__icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
            stroke="currentColor" class="main-header__icon">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
          </svg>
        </button>

        <button class="main-header__icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
            stroke="currentColor" class="main-header__icon">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
          </svg>
        </button>

        <button
          type="button"
          (click)="logout()"
          title="تسجيل الخروج"
          aria-label="تسجيل الخروج"
          class="main-header__icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
            stroke="currentColor" class="main-header__icon">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
          </svg>
        </button>

        <div class="main-header__avatar">
          <img src="/assets/images/avatar.jpg"
            alt="User Profile Picture" class="main-header__avatar-img" />
        </div>
      </div>

    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="main-footer">
    <div class="main-footer__inner">
      <div class="main-footer__start">
        <span class="main-footer__brand">SKey ERP</span>
        <span>© Skey ERP Solutions. All rights reserved 2024</span>
      </div>
      <div class="main-footer__links">
        <a href="#" class="main-footer__link">Documentation</a>
        <a href="#" class="main-footer__link">Support</a>
        <a href="#" class="main-footer__link">Terms of Service</a>
        <a href="#" class="main-footer__link">Privacy Policy</a>
      </div>
    </div>
  </footer>

</div>
